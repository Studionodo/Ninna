<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ninna · diario del sonno neonatale</title>
  <meta name="description" content="Ninna prevede pisolini e nanna del tuo bambino con un metodo trasparente. Gratuita, senza account, dati solo sul tuo dispositivo." />
  <meta name="theme-color" content="#0B1118" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <script>
    /* imposta la lingua del documento prima del primo render, per i lettori di schermo */
    try {
      var p = JSON.parse(localStorage.getItem("ninna_v1") || "{}");
      if (p && p.prefs && p.prefs.lang) document.documentElement.lang = p.prefs.lang;
    } catch (e) {}
  </script>
  <noscript>
    <div style="max-width:460px;margin:20vh auto;padding:0 24px;text-align:center;color:#EAF2EE;font-family:system-ui,sans-serif">
      <p style="font-size:20px;margin-bottom:10px">Ninna</p>
      <p style="color:#A6B7B0;line-height:1.6">Per funzionare, Ninna ha bisogno di JavaScript attivo nel browser.<br>
      <span style="font-size:13px">Ninna needs JavaScript enabled in your browser.</span></p>
    </div>
  </noscript>
  <div class="frame">
    <div id="app"></div>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <nav class="tabbar" id="tabbar"></nav>
  <div id="toast" class="toast" hidden></div>
  <div id="modal-root"></div>
  <div id="miniplayer-root"></div>
  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
