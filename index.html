<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ninna · diario del sonno neonatale</title>
  <meta name="description" content="Ninna prevede pisolini e nanna del tuo bambino con un metodo trasparente. Gratuita, senza account, dati solo sul tuo dispositivo." />
  <meta name="theme-color" content="#0B1118" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    /* lingua e tema applicati prima del primo disegno: niente lampo del tema sbagliato */
    try {
      var p = (JSON.parse(localStorage.getItem("ninna_v1") || "{}") || {}).prefs || {};
      if (p.lang) document.documentElement.lang = p.lang;
      if (p.theme === "light" || p.theme === "dark") document.documentElement.classList.add("theme-" + p.theme);
    } catch (e) {}
  </script>
</head>
<body>
  <noscript>
    <div style="max-width:460px;margin:20vh auto;padding:0 24px;text-align:center;font-family:system-ui,sans-serif">
      <p style="font-size:20px;margin-bottom:10px">Ninna</p>
      <p style="line-height:1.6">Per funzionare, Ninna ha bisogno di JavaScript attivo nel browser.<br>
      <span style="font-size:13px">Ninna needs JavaScript enabled in your browser.</span></p>
    </div>
  </noscript>
  <main id="app" class="app"></main>
  <div id="bottom" class="bottom" hidden>
    <div id="dock"></div>
    <nav id="tabbar" aria-label="Ninna"></nav>
  </div>
  <div id="layers"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
    }
  </script>
</body>
</html>
